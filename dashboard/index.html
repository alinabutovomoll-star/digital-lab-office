<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06080F">
<title>Digital Lab Office</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#06080F;--card:#0E1220;--line:#1D2334;--ink:#F4F2ED;--muted:#9AA3B2;--blue:#2443F0;--sky:#7088FF;--ok:#3DDC97;--warn:#FFB547;--bad:#FF5C7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1100px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}
h1{font-size:28px;letter-spacing:-.04em;margin:0}h1 i{font-style:normal;color:var(--blue)}
.sub{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-size:30px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:28px 0 12px;font-weight:700}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:border-color .2s}
.proj:hover,.proj.on{border-color:var(--sky)}
.proj .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.proj strong{font-size:16px;letter-spacing:-.02em}
.pct{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:9px;margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--muted)}
.dot.doing{border-color:var(--sky);background:var(--sky)}.dot.review{border-color:var(--warn);background:var(--warn)}.dot.done{border-color:var(--ok);background:var(--ok)}
.task .t{font-weight:600}.task.isdone .t{color:var(--muted);text-decoration:line-through}
.task .d{color:var(--muted);font-size:12px;margin-top:2px}
.when{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}.when.late{color:var(--bad);font-weight:700}
.p1{color:var(--bad)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mate{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.mate b{display:block}.mate span{color:var(--muted);font-size:12px}
.mate .n{font-size:22px;font-weight:800;margin-top:8px}
.empty{padding:22px;color:var(--muted);text-align:center}
.err{background:#2a0f17;border:1px solid var(--bad);border-radius:14px;padding:14px;margin-bottom:16px}
@media(max-width:700px){.kpis,.team{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}
</style>
</head>
<body>
<div class="w">
  <header>
    <div><h1>Digital Lab <i>Office</i></h1><div class="sub" id="upd">Загрузка…</div></div>
  </header>
  <div id="err"></div>
  <div class="kpis" id="kpis"></div>

  <h2>Проекты</h2>
  <div class="projects" id="projects"></div>

  <h2>Задачи</h2>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="tasks"></div>

  <h2>Команда</h2>
  <div class="team" id="team"></div>
</div>

<script>
const TEAM={alina:["Алина","CEO"],alice:["Алиса","Ассистент"],dmitry:["Дмитрий","Проджект-менеджер"],maria:["Мария","Дизайнер"],maxim:["Максим","Веб-разработчик"],ilya:["Илья","Боты и автоматизация"],alexander:["Александр","Тестировщик"],daria:["Дарья","Маркетолог"]};
const TABS=[["mine","Мои рабочие"],["personal","Личное"],["team","Команда"],["review","На согласовании"],["done","Закрыто за 2 недели"]];
let DATA=null,TAB="mine",PROJECT=null;
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";

async function load(){
  const key=new URLSearchParams(location.search).get("key")||"";
  try{
    const r=await fetch("/api/data?key="+encodeURIComponent(key),{headers:{"x-telegram-init-data":tg?tg.initData:""}});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    DATA=j; $("err").innerHTML=""; render();
    $("upd").textContent="Обновлено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  }catch(e){$("err").innerHTML=`<div class="err">Не получилось загрузить: ${esc(e.message)}</div>`;$("upd").textContent="";}
}

function render(){
  const {projects,tasks}=DATA, now=Date.now();
  const open=tasks.filter(t=>t.status!=="done");
  const active=projects.filter(p=>p.status!=="готов");
  const late=open.filter(t=>t.due&&new Date(t.due)<now);
  const doneWeek=tasks.filter(t=>t.status==="done"&&new Date(t.done_at)>now-7*864e5);
  $("kpis").innerHTML=[[active.length,"активных проектов"],[open.length,"открытых задач"],[late.length,"просрочено"],[doneWeek.length,"закрыто за неделю"]]
    .map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("");

  $("projects").innerHTML=active.length?active.map(p=>`
    <div class="proj ${PROJECT===p.id?"on":""}" onclick="pick(${p.id})">
      <div class="top"><strong>${esc(p.title)}</strong><span class="pct">${p.percent}%</span></div>
      <div class="bar"><i style="width:${p.percent}%"></i></div>
      <div class="meta"><span class="chip">${esc(p.status)}</span>${p.kind?`<span class="chip">${esc(p.kind)}</span>`:""}
      ${p.client?`<span class="chip">${esc(p.client)}</span>`:""}${p.deadline?`<span class="chip">до ${new Date(p.deadline).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}</span>`:""}
      <span class="chip">${p.tasks_done}/${p.tasks_total} задач</span></div>
    </div>`).join(""):`<div class="empty">Проектов пока нет — пришли Алисе первое ТЗ.</div>`;

  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${TAB===k?"on":""}" onclick="tab('${k}')">${l}</button>`).join("")
    +(PROJECT?`<button class="tab on" onclick="pick(null)">Проект #${PROJECT} ✕</button>`:"");

  let list=tasks;
  if(PROJECT) list=list.filter(t=>t.project_id===PROJECT);
  list={mine:list.filter(t=>t.assignee==="alina"&&t.area==="работа"&&t.status!=="done"),
        personal:list.filter(t=>t.area==="личное"&&t.status!=="done"),
        team:list.filter(t=>t.assignee!=="alina"&&t.status!=="done"),
        review:list.filter(t=>t.status==="review"),
        done:list.filter(t=>t.status==="done")}[TAB];
  $("tasks").innerHTML=list.length?list.map(t=>{
    const isLate=t.due&&t.status!=="done"&&new Date(t.due)<now;
    const who=TEAM[t.assignee]?TEAM[t.assignee][0]:t.assignee;
    const proj=projects.find(p=>p.id===t.project_id);
    return `<div class="task ${t.status==="done"?"isdone":""}"><span class="dot ${t.status}"></span>
      <div><div class="t">${t.priority===1?'<span class="p1">● </span>':""}${esc(t.title)} <span class="sub">#${t.id}</span></div>
      <div class="d">${esc(who)}${proj?" · "+esc(proj.title):""}${t.details?" · "+esc(t.details.slice(0,120)):""}</div></div>
      <div class="when ${isLate?"late":""}">${t.status==="done"?fmt(t.done_at):fmt(t.due)}</div></div>`}).join("")
    :`<div class="empty">Пусто 🎉</div>`;

  $("team").innerHTML=Object.entries(TEAM).filter(([k])=>k!=="alina").map(([k,[n,r]])=>{
    const mine=open.filter(t=>t.assignee===k);
    return `<div class="mate"><b>${n}</b><span>${r}</span><div class="n">${mine.length}</div><span>${mine.filter(t=>t.status==="doing").length} в работе</span></div>`}).join("");
}
function tab(k){TAB=k;render()}
function pick(id){PROJECT=id;render()}
load(); setInterval(load,60000);
</script>
</body>
</html>
